  <div id="app"><div class="boot">Đang mở lớp học tiếng Anh…</div></div>
  <script>
const COURSES = [{"id":"a0-01","level":"A0","title":"Chào hỏi và giới thiệu","topic":"To be: am / is / are","rule":"I + am; he, she, it + is; you, we, they + are. Dùng để nói tên, trạng thái và nghề nghiệp.","example":"I am a student.","translation":"Tôi là sinh viên.","grammar":{"q":"She ___ a teacher.","a":"is","wrong":["am","are","be"],"why":"She đi với is."},"reading":{"text":"Hi! My name is Anna. I am a student from Hanoi.","q":"What is Anna?","a":"a student","wrong":["a doctor","a teacher","a pilot"]},"vocab":[{"en":"hello","vi":"xin chào"},{"en":"name","vi":"tên"},{"en":"student","vi":"sinh viên"},{"en":"teacher","vi":"giáo viên"},{"en":"friend","vi":"bạn bè"}],"speak":"Hello! My name is An. I am a student.","write":"Viết 3 câu giới thiệu tên, nơi ở và nghề nghiệp.","model":"Hello! My name is Minh. I am from Vietnam. I am a student."},{"id":"a0-02","level":"A0","title":"Bảng chữ cái và đánh vần","topic":"Letters & spelling","rule":"Hỏi cách đánh vần: How do you spell ...? Trả lời từng chữ cái. Chú ý chữ cái và âm đọc không luôn giống nhau.","example":"How do you spell your name?","translation":"Bạn đánh vần tên bạn thế nào?","grammar":{"q":"How do you ___ your name?","a":"spell","wrong":["spells","spelling","spelled"],"why":"Sau do you dùng động từ nguyên mẫu spell."},"reading":{"text":"My name is Ben. It is B-E-N.","q":"How many letters are in Ben?","a":"three","wrong":["two","four","five"]},"vocab":[{"en":"letter","vi":"chữ cái"},{"en":"spell","vi":"đánh vần"},{"en":"word","vi":"từ"},{"en":"alphabet","vi":"bảng chữ cái"},{"en":"sound","vi":"âm thanh"}],"speak":"My name is Lan. L-A-N.","write":"Viết tên của bạn và đánh vần bằng tiếng Anh.","model":"My name is Linh. L-I-N-H."},{"id":"a0-03","level":"A0","title":"Đại từ nhân xưng","topic":"I / you / he / she / we / they","rule":"Đại từ chủ ngữ thay cho tên người hoặc vật: I, you, he, she, it, we, they.","example":"He is my brother.","translation":"Anh ấy là anh trai tôi.","grammar":{"q":"Tom is my friend. ___ is kind.","a":"He","wrong":["She","It","They"],"why":"Tom là nam nên dùng He."},"reading":{"text":"Lucy is my sister. She is 12 years old.","q":"Who is Lucy?","a":"the speaker’s sister","wrong":["the speaker’s brother","a friend","a teacher"]},"vocab":[{"en":"he","vi":"anh ấy"},{"en":"she","vi":"cô ấy"},{"en":"they","vi":"họ"},{"en":"we","vi":"chúng tôi"},{"en":"it","vi":"nó"}],"speak":"She is my friend. We are students.","write":"Viết 4 câu dùng I, he, she và they.","model":"I am happy. He is my friend. She is a doctor. They are students."},{"id":"a0-04","level":"A0","title":"Mạo từ a / an","topic":"Articles a / an","rule":"Dùng a trước âm phụ âm; an trước âm nguyên âm. Dựa vào cách phát âm, không chỉ chữ cái.","example":"She has an apple.","translation":"Cô ấy có một quả táo.","grammar":{"q":"It is ___ orange.","a":"an","wrong":["a","the","are"],"why":"Orange bắt đầu bằng âm nguyên âm nên dùng an."},"reading":{"text":"I have an umbrella and a bag.","q":"What does the speaker have?","a":"an umbrella and a bag","wrong":["two umbrellas","one book","a phone"]},"vocab":[{"en":"apple","vi":"quả táo"},{"en":"orange","vi":"quả cam"},{"en":"umbrella","vi":"ô"},{"en":"bag","vi":"túi"},{"en":"book","vi":"sách"}],"speak":"It is an apple. It is a book.","write":"Viết 3 ví dụ với a và 3 ví dụ với an.","model":"A car, a dog, a book. An apple, an egg, an orange."},{"id":"a0-05","level":"A0","title":"Danh từ số nhiều","topic":"Plural nouns","rule":"Thường thêm -s/-es: book → books, box → boxes. Một số bất quy tắc: child → children.","example":"I have two books.","translation":"Tôi có hai quyển sách.","grammar":{"q":"There are three ___.","a":"boxes","wrong":["box","boxs","boxing"],"why":"Sau three dùng danh từ số nhiều boxes."},"reading":{"text":"There are three cats and two dogs in the garden.","q":"How many cats are there?","a":"three","wrong":["one","two","four"]},"vocab":[{"en":"cat","vi":"con mèo"},{"en":"dog","vi":"con chó"},{"en":"box","vi":"cái hộp"},{"en":"child","vi":"đứa trẻ"},{"en":"garden","vi":"khu vườn"}],"speak":"I have two books and three pens.","write":"Viết 5 danh từ số ít và dạng số nhiều.","model":"One cat → two cats; one dog → two dogs; one box → two boxes."},{"id":"a0-06","level":"A0","title":"Số đếm và tuổi","topic":"Numbers & age","rule":"Hỏi tuổi: How old are you? → I am ... years old. Số hàng chục: twenty, thirty, forty...","example":"I am nineteen years old.","translation":"Tôi 19 tuổi.","grammar":{"q":"How old ___ you?","a":"are","wrong":["is","am","be"],"why":"You đi với are."},"reading":{"text":"Tom is 20. His sister Amy is 18.","q":"How old is Amy?","a":"18","wrong":["20","19","21"]},"vocab":[{"en":"number","vi":"con số"},{"en":"age","vi":"tuổi"},{"en":"twenty","vi":"hai mươi"},{"en":"thirty","vi":"ba mươi"},{"en":"year","vi":"năm"}],"speak":"I am twenty years old.","write":"Viết tuổi của bạn và 5 số bằng chữ.","model":"I am 19 years old. One, seven, fifteen, twenty, thirty."},{"id":"a0-07","level":"A0","title":"This / that / these / those","topic":"Demonstratives","rule":"This/these chỉ gần; that/those chỉ xa. This/that số ít, these/those số nhiều.","example":"These are my shoes.","translation":"Đây là những đôi giày của tôi.","grammar":{"q":"___ are my two pens here.","a":"These","wrong":["This","That","It"],"why":"Two pens là số nhiều ở gần → These."},"reading":{"text":"This is my bag. Those are my shoes over there.","q":"What is near the speaker?","a":"the bag","wrong":["the shoes","the car","the desk"]},"vocab":[{"en":"this","vi":"cái này"},{"en":"that","vi":"cái kia"},{"en":"these","vi":"những cái này"},{"en":"those","vi":"những cái kia"},{"en":"shoe","vi":"giày"}],"speak":"This is my phone. Those are my books.","write":"Mô tả 4 đồ vật gần và xa bạn.","model":"This is my pen. These are my books. That is a chair. Those are shoes."},{"id":"a0-08","level":"A0","title":"Tính từ sở hữu","topic":"My / your / his / her","rule":"My, your, his, her, its, our, their đứng trước danh từ để chỉ sở hữu.","example":"This is her laptop.","translation":"Đây là máy tính xách tay của cô ấy.","grammar":{"q":"He has a bike. It is ___ bike.","a":"his","wrong":["her","their","our"],"why":"He tương ứng với his."},"reading":{"text":"My friend is Peter. His phone is new.","q":"Whose phone is new?","a":"Peter’s","wrong":["Anna’s","the teacher’s","Mary’s"]},"vocab":[{"en":"my","vi":"của tôi"},{"en":"your","vi":"của bạn"},{"en":"his","vi":"của anh ấy"},{"en":"her","vi":"của cô ấy"},{"en":"their","vi":"của họ"}],"speak":"This is my book. That is her bag.","write":"Viết 5 câu về các đồ vật của người thân.","model":"My brother has a bike. His bike is blue. Our house is small."},{"id":"a0-09","level":"A0","title":"Câu hỏi với What / Where","topic":"Basic questions","rule":"What hỏi cái gì, Where hỏi ở đâu, Who hỏi ai. Đảo to be trước chủ ngữ khi đặt câu hỏi.","example":"Where are you from?","translation":"Bạn đến từ đâu?","grammar":{"q":"___ is your name?","a":"What","wrong":["Where","When","Who"],"why":"Hỏi tên sử dụng What."},"reading":{"text":"My name is Alex. I am from Canada.","q":"Where is Alex from?","a":"Canada","wrong":["Vietnam","Japan","France"]},"vocab":[{"en":"what","vi":"cái gì"},{"en":"where","vi":"ở đâu"},{"en":"who","vi":"ai"},{"en":"country","vi":"quốc gia"},{"en":"city","vi":"thành phố"}],"speak":"What is your name? Where are you from?","write":"Viết 4 câu hỏi giới thiệu bản thân.","model":"What is your name? Where are you from? Who is your teacher? What is your job?"},{"id":"a0-10","level":"A0","title":"Ngày, tháng và giờ","topic":"Dates & time","rule":"What time is it? → It is seven o’clock. Dùng on với ngày; in với tháng và năm; at với giờ.","example":"My class starts at eight.","translation":"Lớp của tôi bắt đầu lúc tám giờ.","grammar":{"q":"The meeting is ___ Monday.","a":"on","wrong":["in","at","by"],"why":"Dùng on với ngày trong tuần."},"reading":{"text":"My English class is on Friday at 9 a.m.","q":"When is the English class?","a":"Friday at 9 a.m.","wrong":["Monday at 9 a.m.","Friday at 6 p.m.","Saturday at 9 a.m."]},"vocab":[{"en":"Monday","vi":"thứ Hai"},{"en":"Friday","vi":"thứ Sáu"},{"en":"today","vi":"hôm nay"},{"en":"tomorrow","vi":"ngày mai"},{"en":"clock","vi":"đồng hồ"}],"speak":"It is nine o’clock on Friday.","write":"Viết lịch 3 hoạt động trong tuần.","model":"I study on Monday at 7 p.m. I work on Tuesday. I rest on Sunday."},{"id":"a0-11","level":"A0","title":"Có / không có","topic":"There is / there are","rule":"There is + danh từ số ít; there are + danh từ số nhiều. Phủ định: there isn’t / there aren’t.","example":"There is a table in my room.","translation":"Có một cái bàn trong phòng tôi.","grammar":{"q":"There ___ two windows.","a":"are","wrong":["is","am","be"],"why":"Two windows là số nhiều → are."},"reading":{"text":"There is a bed and two chairs in my room.","q":"How many chairs are there?","a":"two","wrong":["one","three","four"]},"vocab":[{"en":"room","vi":"phòng"},{"en":"table","vi":"bàn"},{"en":"chair","vi":"ghế"},{"en":"window","vi":"cửa sổ"},{"en":"bed","vi":"giường"}],"speak":"There is a desk. There are two chairs.","write":"Mô tả phòng của bạn bằng 4 câu.","model":"There is a bed. There are two windows. There is a desk near the door."},{"id":"a0-12","level":"A0","title":"Thói quen đơn giản","topic":"Present simple: positive","rule":"Hiện tại đơn: I/you/we/they + V; he/she/it + V-s/es. Dùng cho thói quen và sự thật.","example":"She studies English every day.","translation":"Cô ấy học tiếng Anh mỗi ngày.","grammar":{"q":"He ___ to school every day.","a":"goes","wrong":["go","going","gone"],"why":"He + goes (go → goes)."},"reading":{"text":"Mina wakes up at seven and walks to school.","q":"How does Mina go to school?","a":"on foot","wrong":["by bus","by car","by train"]},"vocab":[{"en":"wake up","vi":"thức dậy"},{"en":"study","vi":"học"},{"en":"work","vi":"làm việc"},{"en":"walk","vi":"đi bộ"},{"en":"every day","vi":"mỗi ngày"}],"speak":"I study English every day.","write":"Viết 5 câu về lịch sinh hoạt hằng ngày.","model":"I wake up at six. I eat breakfast. I study English. I work. I sleep at ten."},{"id":"a1-01","level":"A1","title":"Gia đình và người thân","topic":"Possessive ’s","rule":"Dùng ’s sau tên người để chỉ sở hữu: Anna’s brother. Với danh từ số nhiều tận cùng s: my parents’ house.","example":"This is my father’s car.","translation":"Đây là xe của bố tôi.","grammar":{"q":"This is ___ sister. (Tom)","a":"Tom’s","wrong":["Toms","Tom","Toms’"],"why":"Danh từ riêng số ít dùng ’s."},"reading":{"text":"Nina has one brother. His name is Leo.","q":"Who is Leo?","a":"Nina’s brother","wrong":["Nina’s father","Nina’s uncle","Nina’s cousin"]},"vocab":[{"en":"mother","vi":"mẹ"},{"en":"father","vi":"bố"},{"en":"sister","vi":"chị hoặc em gái"},{"en":"brother","vi":"anh hoặc em trai"},{"en":"parents","vi":"cha mẹ"}],"speak":"This is my mother’s phone.","write":"Viết 5 câu giới thiệu gia đình.","model":"My family is small. My father is a driver. My mother is a teacher."},{"id":"a1-02","level":"A1","title":"Nghề nghiệp và công việc","topic":"Present simple questions","rule":"Hỏi hiện tại đơn: Do + I/you/we/they + V? Does + he/she/it + V? Động từ sau does không thêm s.","example":"Does she work in an office?","translation":"Cô ấy làm việc ở văn phòng à?","grammar":{"q":"___ your father work here?","a":"Does","wrong":["Do","Is","Are"],"why":"Your father = he → Does."},"reading":{"text":"Linda is a nurse. She works at a hospital.","q":"Where does Linda work?","a":"at a hospital","wrong":["at a bank","at a school","at home"]},"vocab":[{"en":"job","vi":"nghề nghiệp"},{"en":"nurse","vi":"y tá"},{"en":"office","vi":"văn phòng"},{"en":"hospital","vi":"bệnh viện"},{"en":"engineer","vi":"kỹ sư"}],"speak":"Does your brother work?","write":"Viết 4 câu hỏi về nghề nghiệp người thân.","model":"Does your father work? Where does your mother work? Do you have a job?"},{"id":"a1-03","level":"A1","title":"Đồ ăn và thức uống","topic":"Some / any","rule":"Some thường dùng trong khẳng định; any thường dùng trong phủ định và câu hỏi. Có ngoại lệ với lời mời/đề nghị.","example":"I have some rice.","translation":"Tôi có một ít cơm.","grammar":{"q":"Do we have ___ milk?","a":"any","wrong":["some","many","a"],"why":"Câu hỏi thông thường dùng any."},"reading":{"text":"I eat bread and eggs for breakfast. I drink tea.","q":"What does the speaker drink?","a":"tea","wrong":["coffee","milk","water"]},"vocab":[{"en":"bread","vi":"bánh mì"},{"en":"egg","vi":"trứng"},{"en":"rice","vi":"cơm"},{"en":"milk","vi":"sữa"},{"en":"tea","vi":"trà"}],"speak":"I would like some water, please.","write":"Viết thực đơn sáng, trưa, tối bằng tiếng Anh.","model":"For breakfast, I eat eggs. For lunch, I have rice. For dinner, I eat vegetables."},{"id":"a1-04","level":"A1","title":"Mua sắm và giá cả","topic":"How much / how many","rule":"How much hỏi giá hoặc lượng không đếm được; how many hỏi số lượng đếm được.","example":"How much is this shirt?","translation":"Chiếc áo này giá bao nhiêu?","grammar":{"q":"How ___ apples do you want?","a":"many","wrong":["much","a lot","any"],"why":"Apples là danh từ đếm được."},"reading":{"text":"The blue shirt costs ten dollars. The red one costs twelve.","q":"Which shirt is cheaper?","a":"the blue shirt","wrong":["the red shirt","both are the same","neither shirt"]},"vocab":[{"en":"price","vi":"giá"},{"en":"cheap","vi":"rẻ"},{"en":"expensive","vi":"đắt"},{"en":"shirt","vi":"áo sơ mi"},{"en":"cash","vi":"tiền mặt"}],"speak":"How much is this?","write":"Viết đoạn hội thoại mua áo 4 câu.","model":"A: How much is this shirt? B: Ten dollars. A: Can I try it? B: Sure."},{"id":"a1-05","level":"A1","title":"Nhà ở và đồ vật","topic":"Prepositions of place","rule":"In = bên trong; on = trên bề mặt; under = dưới; next to = bên cạnh; between = ở giữa.","example":"The phone is on the table.","translation":"Điện thoại ở trên bàn.","grammar":{"q":"The cat is ___ the table. (bên dưới)","a":"under","wrong":["on","in","next to"],"why":"Under = bên dưới."},"reading":{"text":"The keys are next to the laptop on the desk.","q":"Where are the keys?","a":"next to the laptop","wrong":["under the desk","in the bag","on the floor"]},"vocab":[{"en":"kitchen","vi":"bếp"},{"en":"bedroom","vi":"phòng ngủ"},{"en":"behind","vi":"phía sau"},{"en":"under","vi":"bên dưới"},{"en":"next to","vi":"bên cạnh"}],"speak":"The bag is under the chair.","write":"Mô tả vị trí 5 đồ vật trong nhà.","model":"My phone is on the table. My bag is under the chair. My bed is next to the window."},{"id":"a1-06","level":"A1","title":"Việc đang diễn ra","topic":"Present continuous","rule":"Am/is/are + V-ing để diễn tả hành động đang xảy ra ngay lúc nói.","example":"I am reading a book now.","translation":"Tôi đang đọc sách.","grammar":{"q":"They ___ playing football now.","a":"are","wrong":["is","am","do"],"why":"They + are + V-ing."},"reading":{"text":"Sam is cooking dinner. His sister is watching TV.","q":"What is Sam doing?","a":"cooking dinner","wrong":["watching TV","doing homework","sleeping"]},"vocab":[{"en":"reading","vi":"đang đọc"},{"en":"cooking","vi":"đang nấu"},{"en":"watching","vi":"đang xem"},{"en":"playing","vi":"đang chơi"},{"en":"now","vi":"bây giờ"}],"speak":"I am learning English now.","write":"Viết 4 câu về điều mọi người đang làm.","model":"I am studying. My brother is playing games. My mother is cooking."},{"id":"a1-07","level":"A1","title":"Khả năng và sở thích","topic":"Can / can’t","rule":"Can + động từ nguyên mẫu diễn tả khả năng. Can’t + V diễn tả không thể.","example":"She can swim very well.","translation":"Cô ấy bơi rất giỏi.","grammar":{"q":"I can ___ a bike.","a":"ride","wrong":["rides","riding","rode"],"why":"Sau can dùng động từ nguyên mẫu."},"reading":{"text":"Tom can play the guitar, but he cannot sing well.","q":"What can Tom do?","a":"play the guitar","wrong":["sing well","cook pasta","dance salsa"]},"vocab":[{"en":"swim","vi":"bơi"},{"en":"ride","vi":"đi xe"},{"en":"sing","vi":"hát"},{"en":"dance","vi":"nhảy"},{"en":"draw","vi":"vẽ"}],"speak":"I can speak a little English.","write":"Viết 5 điều bạn có thể và không thể làm.","model":"I can swim. I can cook. I can ride a bike. I can’t drive a car."},{"id":"a1-08","level":"A1","title":"Thời tiết và trang phục","topic":"Present simple vs continuous","rule":"Hiện tại đơn cho thói quen; tiếp diễn cho sự việc lúc này. Often/every day gợi ý đơn; now/at the moment gợi ý tiếp diễn.","example":"It usually rains in July.","translation":"Thường mưa vào tháng Bảy.","grammar":{"q":"Look! It ___ outside.","a":"is raining","wrong":["rains","rain","rained"],"why":"Look! biểu thị điều đang xảy ra → is raining."},"reading":{"text":"It is cold today, so Eva is wearing a coat.","q":"Why is Eva wearing a coat?","a":"because it is cold","wrong":["because it is hot","because it is raining","because she is swimming"]},"vocab":[{"en":"sunny","vi":"nắng"},{"en":"rainy","vi":"mưa"},{"en":"windy","vi":"có gió"},{"en":"coat","vi":"áo khoác"},{"en":"weather","vi":"thời tiết"}],"speak":"It is sunny today. I am wearing a T-shirt.","write":"Viết 4 câu về thời tiết hôm nay và trang phục.","model":"It is warm today. I am wearing a T-shirt. I usually wear a jacket in winter."},{"id":"a1-09","level":"A1","title":"Kể chuyện hôm qua","topic":"Past simple: was / were","rule":"I/he/she/it + was; you/we/they + were. Phủ định wasn’t / weren’t.","example":"I was tired yesterday.","translation":"Hôm qua tôi mệt.","grammar":{"q":"They ___ at home last night.","a":"were","wrong":["was","are","is"],"why":"They dùng were trong quá khứ."},"reading":{"text":"Yesterday, Mia was at the library. Her friends were at the park.","q":"Where was Mia?","a":"at the library","wrong":["at the park","at home","at school"]},"vocab":[{"en":"yesterday","vi":"hôm qua"},{"en":"last night","vi":"tối qua"},{"en":"tired","vi":"mệt"},{"en":"happy","vi":"vui"},{"en":"busy","vi":"bận"}],"speak":"I was at home yesterday.","write":"Viết 5 câu về hôm qua dùng was/were.","model":"I was at school yesterday. My friends were busy. The weather was nice."},{"id":"a1-10","level":"A1","title":"Kỳ nghỉ đáng nhớ","topic":"Past simple: regular verbs","rule":"Quá khứ đơn động từ có quy tắc thêm -ed: visit → visited, play → played.","example":"We visited a museum.","translation":"Chúng tôi đã thăm một bảo tàng.","grammar":{"q":"She ___ TV last night.","a":"watched","wrong":["watch","watches","watching"],"why":"Last night → watched."},"reading":{"text":"Last Sunday, Ben visited his grandmother and played football.","q":"Who did Ben visit?","a":"his grandmother","wrong":["his teacher","his brother","his friend"]},"vocab":[{"en":"visited","vi":"đã đến thăm"},{"en":"watched","vi":"đã xem"},{"en":"played","vi":"đã chơi"},{"en":"walked","vi":"đã đi bộ"},{"en":"cleaned","vi":"đã dọn dẹp"}],"speak":"I visited my grandparents last weekend.","write":"Viết đoạn 5 câu về cuối tuần vừa rồi.","model":"Last weekend, I cleaned my room. I visited my friend. We watched a movie."},{"id":"a1-11","level":"A1","title":"Đi lại và du lịch","topic":"Past simple: irregular verbs","rule":"Một số động từ bất quy tắc: go → went, eat → ate, see → saw, buy → bought.","example":"We went to Da Nang last year.","translation":"Chúng tôi đã tới Đà Nẵng năm ngoái.","grammar":{"q":"I ___ a new book yesterday.","a":"bought","wrong":["buy","buyed","buying"],"why":"Buy có quá khứ bất quy tắc bought."},"reading":{"text":"Liam went to Hue by train and saw an old palace.","q":"How did Liam travel?","a":"by train","wrong":["by car","by plane","by bike"]},"vocab":[{"en":"train","vi":"tàu hỏa"},{"en":"ticket","vi":"vé"},{"en":"airport","vi":"sân bay"},{"en":"journey","vi":"chuyến đi"},{"en":"palace","vi":"cung điện"}],"speak":"I went to Hanoi by bus.","write":"Kể một chuyến đi bằng 5 câu quá khứ.","model":"Last summer, I went to the beach. I swam in the sea. I ate seafood."},{"id":"a1-12","level":"A1","title":"Dự định gần","topic":"Be going to","rule":"Am/is/are going to + V cho kế hoạch, dự định hoặc dự đoán có căn cứ.","example":"I am going to study tonight.","translation":"Tôi sẽ học tối nay.","grammar":{"q":"She is going to ___ a new phone.","a":"buy","wrong":["buys","bought","buying"],"why":"Sau going to là động từ nguyên mẫu."},"reading":{"text":"Amy has a ticket. She is going to fly to Singapore tomorrow.","q":"Where is Amy going?","a":"Singapore","wrong":["Thailand","Vietnam","Japan"]},"vocab":[{"en":"plan","vi":"kế hoạch"},{"en":"future","vi":"tương lai"},{"en":"tomorrow","vi":"ngày mai"},{"en":"travel","vi":"du lịch"},{"en":"ticket","vi":"vé"}],"speak":"I am going to practice English tomorrow.","write":"Viết 5 dự định tuần tới.","model":"I am going to study English. I am going to meet my friends on Sunday."},{"id":"a2-01","level":"A2","title":"So sánh người và vật","topic":"Comparatives / superlatives","rule":"So sánh hơn: taller/more expensive + than. So sánh nhất: the tallest/the most expensive.","example":"My city is bigger than yours.","translation":"Thành phố tôi lớn hơn thành phố bạn.","grammar":{"q":"This test is ___ than the last one.","a":"easier","wrong":["easy","easiest","more easy"],"why":"Easy → easier trong so sánh hơn."},"reading":{"text":"Bike A costs $100. Bike B costs $200.","q":"Which bike is cheaper?","a":"Bike A","wrong":["Bike B","both","neither"]},"vocab":[{"en":"taller","vi":"cao hơn"},{"en":"cheaper","vi":"rẻ hơn"},{"en":"better","vi":"tốt hơn"},{"en":"worst","vi":"tệ nhất"},{"en":"similar","vi":"tương tự"}],"speak":"English is more useful than I thought.","write":"So sánh 3 đồ vật hoặc địa điểm bằng 5 câu.","model":"My laptop is lighter than my old one. This park is the biggest in my city."},{"id":"a2-02","level":"A2","title":"Trải nghiệm sống","topic":"Present perfect: ever / never","rule":"Have/has + V3. Ever dùng hỏi trải nghiệm; never dùng nói chưa từng. Không nhấn thời điểm cụ thể.","example":"Have you ever tried sushi?","translation":"Bạn từng thử sushi chưa?","grammar":{"q":"She has never ___ abroad.","a":"been","wrong":["was","be","being"],"why":"Present perfect dùng V3 been."},"reading":{"text":"Noah has visited Japan twice but has never been to Korea.","q":"Which country has Noah visited?","a":"Japan","wrong":["Korea","China","India"]},"vocab":[{"en":"experience","vi":"trải nghiệm"},{"en":"ever","vi":"đã từng"},{"en":"never","vi":"chưa bao giờ"},{"en":"abroad","vi":"nước ngoài"},{"en":"twice","vi":"hai lần"}],"speak":"I have never visited Australia.","write":"Viết 5 trải nghiệm đã từng hoặc chưa từng.","model":"I have visited Da Nang. I have never been abroad. I have tried sushi."},{"id":"a2-03","level":"A2","title":"Việc vừa hoàn thành","topic":"Present perfect: just / already / yet","rule":"Just/already thường đứng sau have/has; yet thường cuối câu hỏi hoặc phủ định.","example":"I have just finished my homework.","translation":"Tôi vừa làm xong bài.","grammar":{"q":"Have you finished your work ___?","a":"yet","wrong":["already","just","still"],"why":"Yet đặt cuối câu hỏi về việc hoàn thành."},"reading":{"text":"Mia has already sent the email, but John has not replied yet.","q":"Who has sent the email?","a":"Mia","wrong":["John","both","neither"]},"vocab":[{"en":"already","vi":"đã rồi"},{"en":"yet","vi":"chưa"},{"en":"just","vi":"vừa mới"},{"en":"finish","vi":"hoàn thành"},{"en":"reply","vi":"trả lời"}],"speak":"I have already done my homework.","write":"Viết 4 câu dùng just, already và yet.","model":"I have just eaten. I have already finished my work. I haven’t called Mom yet."},{"id":"a2-04","level":"A2","title":"Một thời điểm trong quá khứ","topic":"Past continuous","rule":"Was/were + V-ing nói hành động đang diễn ra tại một thời điểm quá khứ.","example":"I was studying at 8 p.m.","translation":"Tôi đang học lúc 8 giờ tối.","grammar":{"q":"They ___ sleeping at midnight.","a":"were","wrong":["was","are","did"],"why":"They + were + V-ing."},"reading":{"text":"At 9 p.m., Lucy was reading while her brother was cooking.","q":"What was Lucy doing?","a":"reading","wrong":["cooking","sleeping","driving"]},"vocab":[{"en":"while","vi":"trong khi"},{"en":"midnight","vi":"nửa đêm"},{"en":"during","vi":"trong suốt"},{"en":"at that time","vi":"lúc đó"},{"en":"noise","vi":"tiếng ồn"}],"speak":"I was listening to music at nine.","write":"Viết 5 câu về việc bạn và gia đình đang làm tối qua.","model":"At eight, I was studying. My brother was playing chess. Mom was cooking."},{"id":"a2-05","level":"A2","title":"Sự kiện bị gián đoạn","topic":"Past simple vs past continuous","rule":"Hành động đang diễn ra dùng quá khứ tiếp diễn, hành động xen vào dùng quá khứ đơn, thường đi với when.","example":"I was cooking when you called.","translation":"Tôi đang nấu ăn thì bạn gọi.","grammar":{"q":"I was walking when it ___ to rain.","a":"started","wrong":["starts","starting","start"],"why":"Sự việc xen vào quá khứ đơn started."},"reading":{"text":"When the phone rang, Ava was taking a shower.","q":"What was Ava doing?","a":"taking a shower","wrong":["reading","cooking","sleeping"]},"vocab":[{"en":"suddenly","vi":"đột nhiên"},{"en":"interrupt","vi":"gián đoạn"},{"en":"ring","vi":"reo"},{"en":"shower","vi":"tắm"},{"en":"happen","vi":"xảy ra"}],"speak":"I was working when my friend called.","write":"Viết 4 câu kể sự việc bị gián đoạn bằng when.","model":"I was reading when the lights went out. My dad was cooking when I arrived."},{"id":"a2-06","level":"A2","title":"Dự đoán tương lai","topic":"Will / won’t","rule":"Will + V dùng cho dự đoán, quyết định tại thời điểm nói và lời hứa.","example":"I think it will rain tomorrow.","translation":"Tôi nghĩ mai trời sẽ mưa.","grammar":{"q":"I ___ help you with your bag.","a":"will","wrong":["am","do","have"],"why":"Will + động từ nguyên mẫu diễn tả đề nghị tức thời."},"reading":{"text":"The sky is cloudy. Ben thinks it will rain this afternoon.","q":"What does Ben predict?","a":"rain","wrong":["snow","sunshine","strong wind"]},"vocab":[{"en":"predict","vi":"dự đoán"},{"en":"promise","vi":"hứa"},{"en":"probably","vi":"có lẽ"},{"en":"later","vi":"lát nữa"},{"en":"soon","vi":"sớm"}],"speak":"I think technology will change our lives.","write":"Viết 5 dự đoán về cuộc sống 10 năm tới.","model":"I think cars will become smarter. People will work online more often."},{"id":"a2-07","level":"A2","title":"Điều kiện có thật","topic":"First conditional","rule":"If + hiện tại đơn, will + V: diễn tả kết quả có thể xảy ra trong tương lai.","example":"If I study, I will improve.","translation":"Nếu tôi học, tôi sẽ tiến bộ.","grammar":{"q":"If it rains, we ___ at home.","a":"will stay","wrong":["stayed","stay","would stay"],"why":"Mệnh đề chính dùng will stay."},"reading":{"text":"If Emma finishes early, she will join the party.","q":"When will Emma join the party?","a":"if she finishes early","wrong":["if she is late","if she is ill","if it rains"]},"vocab":[{"en":"if","vi":"nếu"},{"en":"condition","vi":"điều kiện"},{"en":"result","vi":"kết quả"},{"en":"improve","vi":"tiến bộ"},{"en":"prepare","vi":"chuẩn bị"}],"speak":"If I practice daily, I will speak better.","write":"Viết 5 câu điều kiện loại 1 về học tập.","model":"If I learn ten words daily, I will remember more vocabulary."},{"id":"a2-08","level":"A2","title":"Lời khuyên sức khỏe","topic":"Should / shouldn’t","rule":"Should + V để khuyên; shouldn’t + V để khuyên không nên làm.","example":"You should drink more water.","translation":"Bạn nên uống thêm nước.","grammar":{"q":"You ___ sleep so late every night.","a":"shouldn’t","wrong":["should","can","must"],"why":"Khuyên tránh thói quen không tốt → shouldn’t."},"reading":{"text":"Max is tired because he sleeps only four hours.","q":"What should Max do?","a":"sleep more","wrong":["drink coffee all night","stay up later","skip meals"]},"vocab":[{"en":"advice","vi":"lời khuyên"},{"en":"healthy","vi":"khỏe mạnh"},{"en":"rest","vi":"nghỉ ngơi"},{"en":"exercise","vi":"tập thể dục"},{"en":"stress","vi":"căng thẳng"}],"speak":"You should get enough sleep.","write":"Viết 5 lời khuyên cho người học tiếng Anh.","model":"You should practice every day. You shouldn’t be afraid of mistakes."},{"id":"a2-09","level":"A2","title":"Nội quy và nghĩa vụ","topic":"Must / have to","rule":"Must và have to nói nghĩa vụ; mustn’t là cấm; don’t have to là không bắt buộc.","example":"You must wear a helmet.","translation":"Bạn phải đội mũ bảo hiểm.","grammar":{"q":"You ___ smoke in a hospital.","a":"mustn’t","wrong":["don’t have to","can","should"],"why":"Mustn’t = bị cấm, khác don’t have to."},"reading":{"text":"Visitors must show an ID, but they do not have to pay.","q":"What must visitors show?","a":"an ID","wrong":["a ticket","a passport photo","a receipt"]},"vocab":[{"en":"rule","vi":"quy tắc"},{"en":"helmet","vi":"mũ bảo hiểm"},{"en":"required","vi":"bắt buộc"},{"en":"allowed","vi":"được phép"},{"en":"forbidden","vi":"bị cấm"}],"speak":"You must follow traffic rules.","write":"Viết 5 nội quy của lớp hoặc nơi làm việc.","model":"Students must arrive on time. They mustn’t use phones during tests."},{"id":"a2-10","level":"A2","title":"Quá nhiều và vừa đủ","topic":"Too / enough","rule":"Too + adjective: quá mức; adjective + enough: đủ; enough + noun: đủ số lượng.","example":"This bag is too heavy.","translation":"Cái túi này quá nặng.","grammar":{"q":"She is old ___ to drive.","a":"enough","wrong":["too","very","so"],"why":"Old enough = đủ tuổi."},"reading":{"text":"The box is too heavy for Mia, so she asks for help.","q":"Why does Mia need help?","a":"the box is too heavy","wrong":["the box is empty","she is late","she is hungry"]},"vocab":[{"en":"heavy","vi":"nặng"},{"en":"light","vi":"nhẹ"},{"en":"enough","vi":"đủ"},{"en":"too much","vi":"quá nhiều"},{"en":"size","vi":"kích cỡ"}],"speak":"This exercise is easy enough for me.","write":"Viết 4 ví dụ về too và enough.","model":"The room is too noisy. I am strong enough to carry this bag."},{"id":"a2-11","level":"A2","title":"Động từ theo sau","topic":"Gerund / infinitive","rule":"Enjoy/avoid + V-ing; want/hope/decide + to V. Một số động từ có cả hai dạng với khác biệt nghĩa.","example":"I enjoy reading books.","translation":"Tôi thích đọc sách.","grammar":{"q":"She decided ___ English.","a":"to learn","wrong":["learning","learn","learned"],"why":"Decide + to-infinitive."},"reading":{"text":"Leo enjoys cycling, but he wants to learn swimming.","q":"What does Leo enjoy?","a":"cycling","wrong":["swimming","cooking","running"]},"vocab":[{"en":"enjoy","vi":"thích"},{"en":"avoid","vi":"tránh"},{"en":"decide","vi":"quyết định"},{"en":"hope","vi":"hy vọng"},{"en":"prefer","vi":"ưa thích"}],"speak":"I enjoy learning new words.","write":"Viết 5 điều bạn thích và muốn làm.","model":"I enjoy reading. I want to speak English better. I hope to travel abroad."},{"id":"a2-12","level":"A2","title":"Mô tả người, vật","topic":"Relative clauses: who / which / that","rule":"Who chỉ người; which chỉ vật; that thay thế trong nhiều mệnh đề quan hệ xác định.","example":"The woman who lives here is kind.","translation":"Người phụ nữ sống ở đây rất tốt bụng.","grammar":{"q":"This is the book ___ I bought.","a":"that","wrong":["who","where","whose"],"why":"Vật có thể dùng that/which; trong các lựa chọn that đúng."},"reading":{"text":"The man who works at the shop is my uncle.","q":"Who is the speaker’s uncle?","a":"the shop worker","wrong":["a teacher","a driver","a doctor"]},"vocab":[{"en":"relative","vi":"liên quan"},{"en":"describe","vi":"mô tả"},{"en":"person","vi":"người"},{"en":"object","vi":"vật"},{"en":"neighbor","vi":"hàng xóm"}],"speak":"I like books that teach useful skills.","write":"Viết 4 câu miêu tả người hoặc vật bằng who/that.","model":"I have a friend who loves music. This is the phone that I bought."},{"id":"b1-01","level":"B1","title":"Kể chuyện và trải nghiệm","topic":"Present perfect vs past simple","rule":"Present perfect: kinh nghiệm/liên hệ hiện tại, không có thời điểm xác định. Past simple: sự kiện kết thúc tại thời điểm quá khứ xác định.","example":"I have visited Hue, but I went there in 2024.","translation":"Tôi từng thăm Huế, và tôi đến đó năm 2024.","grammar":{"q":"I ___ to Hue last year.","a":"went","wrong":["have gone","go","had gone"],"why":"Last year → quá khứ đơn went."},"reading":{"text":"Sara has seen this movie three times. She first saw it in 2022.","q":"When did Sara first see the movie?","a":"in 2022","wrong":["in 2023","in 2024","yesterday"]},"vocab":[{"en":"recently","vi":"gần đây"},{"en":"since","vi":"kể từ"},{"en":"ago","vi":"trước đây"},{"en":"experience","vi":"trải nghiệm"},{"en":"previously","vi":"trước đó"}],"speak":"I have learned English for two years.","write":"Viết đoạn về kinh nghiệm và một sự kiện cụ thể.","model":"I have traveled to Da Nang twice. I first visited it in 2023."},{"id":"b1-02","level":"B1","title":"Giả định không có thật","topic":"Second conditional","rule":"If + past simple, would + V: giả định ở hiện tại/tương lai ít có thực hoặc không có thật.","example":"If I had more time, I would read more.","translation":"Nếu có thêm thời gian, tôi sẽ đọc nhiều hơn.","grammar":{"q":"If I were rich, I ___ travel the world.","a":"would","wrong":["will","can","am"],"why":"Điều kiện loại 2 dùng would ở mệnh đề chính."},"reading":{"text":"If Jack had a car, he would drive to work, but he takes the bus now.","q":"How does Jack travel now?","a":"by bus","wrong":["by car","by train","on foot"]},"vocab":[{"en":"imaginary","vi":"tưởng tượng"},{"en":"opportunity","vi":"cơ hội"},{"en":"rich","vi":"giàu"},{"en":"afford","vi":"có khả năng chi trả"},{"en":"choice","vi":"lựa chọn"}],"speak":"If I had more time, I would practice daily.","write":"Viết 5 câu giả định về ước mơ.","model":"If I lived abroad, I would practice English every day."},{"id":"b1-03","level":"B1","title":"Câu bị động","topic":"Passive voice: present & past","rule":"Be + V3. Hiện tại: is/are made; quá khứ: was/were built. Tập trung vào đối tượng chịu tác động.","example":"This bridge was built in 2001.","translation":"Cây cầu được xây năm 2001.","grammar":{"q":"English ___ spoken in many countries.","a":"is","wrong":["are","was","be"],"why":"English (danh từ số ít) + is spoken."},"reading":{"text":"The old library was built in 1990 and is used by students today.","q":"When was the library built?","a":"in 1990","wrong":["in 2000","in 2010","in 1980"]},"vocab":[{"en":"built","vi":"được xây"},{"en":"produced","vi":"được sản xuất"},{"en":"designed","vi":"được thiết kế"},{"en":"delivered","vi":"được giao"},{"en":"repaired","vi":"được sửa"}],"speak":"The laptop was repaired yesterday.","write":"Chuyển 5 câu chủ động đơn giản sang bị động.","model":"People grow rice here. → Rice is grown here."},{"id":"b1-04","level":"B1","title":"Tường thuật lời nói","topic":"Reported speech: statements","rule":"Lùi thì thường gặp: am/is → was, are → were, will → would, can → could khi động từ tường thuật ở quá khứ.","example":"He said he was tired.","translation":"Anh ấy nói rằng anh ấy mệt.","grammar":{"q":"She said she ___ busy.","a":"was","wrong":["is","are","were"],"why":"Tường thuật quá khứ thường lùi is → was."},"reading":{"text":"Tom said he was going to study at home that night.","q":"Where was Tom going to study?","a":"at home","wrong":["at school","at a cafe","at the library"]},"vocab":[{"en":"report","vi":"tường thuật"},{"en":"mention","vi":"nhắc đến"},{"en":"claim","vi":"khẳng định"},{"en":"explain","vi":"giải thích"},{"en":"statement","vi":"lời phát biểu"}],"speak":"She said she was learning English.","write":"Chuyển 4 câu nói trực tiếp sang tường thuật.","model":"“I am tired,” he said. → He said he was tired."},{"id":"b1-05","level":"B1","title":"Mệnh đề quan hệ mở rộng","topic":"Defining / non-defining relatives","rule":"Mệnh đề xác định không có dấu phẩy; không xác định thêm thông tin và có dấu phẩy. Không dùng that trong mệnh đề không xác định.","example":"My sister, who lives in Hue, is a doctor.","translation":"Chị tôi, người sống ở Huế, là bác sĩ.","grammar":{"q":"My father, ___ is a teacher, loves books.","a":"who","wrong":["that","which","where"],"why":"Mệnh đề không xác định nói về người dùng who."},"reading":{"text":"My uncle, who is 50, runs a small restaurant in Hanoi.","q":"What business does the uncle run?","a":"a restaurant","wrong":["a hotel","a bookstore","a bank"]},"vocab":[{"en":"information","vi":"thông tin"},{"en":"detail","vi":"chi tiết"},{"en":"clarify","vi":"làm rõ"},{"en":"essential","vi":"thiết yếu"},{"en":"additional","vi":"bổ sung"}],"speak":"Hanoi, which is Vietnam’s capital, is busy.","write":"Viết 4 câu mệnh đề quan hệ có và không có dấu phẩy.","model":"My friend, who lives in Hue, is kind. The book that I bought is useful."},{"id":"b1-06","level":"B1","title":"Cụm động từ thông dụng","topic":"Phrasal verbs","rule":"Phrasal verbs là động từ + giới từ/trạng từ tạo nghĩa mới: give up, look after, find out, turn on.","example":"Don’t give up learning English.","translation":"Đừng từ bỏ học tiếng Anh.","grammar":{"q":"Please ___ the lights before you leave.","a":"turn off","wrong":["look up","give up","take off"],"why":"Turn off = tắt thiết bị."},"reading":{"text":"Nora looks after her little brother while her parents work.","q":"What does Nora do?","a":"cares for her brother","wrong":["goes shopping","cooks at a restaurant","teaches at school"]},"vocab":[{"en":"give up","vi":"từ bỏ"},{"en":"look after","vi":"chăm sóc"},{"en":"find out","vi":"tìm ra"},{"en":"turn off","vi":"tắt"},{"en":"pick up","vi":"đón hoặc nhặt"}],"speak":"I will never give up.","write":"Viết 5 câu dùng các phrasal verbs trong bài.","model":"I look after my sister. I turn off the lights at night."},{"id":"b1-07","level":"B1","title":"Nối ý mạch lạc","topic":"Although / however / because","rule":"Although + mệnh đề; because + mệnh đề nguyên nhân; however liên kết hai ý tương phản và thường có dấu câu.","example":"Although it rained, we went out.","translation":"Mặc dù trời mưa, chúng tôi vẫn ra ngoài.","grammar":{"q":"___ he was tired, he finished the task.","a":"Although","wrong":["Because","Therefore","So"],"why":"Although nêu sự tương phản giữa mệt và vẫn hoàn thành."},"reading":{"text":"It was expensive. However, Lily bought it because she needed it.","q":"Why did Lily buy it?","a":"she needed it","wrong":["it was cheap","it was free","her friend asked"]},"vocab":[{"en":"although","vi":"mặc dù"},{"en":"however","vi":"tuy nhiên"},{"en":"therefore","vi":"vì vậy"},{"en":"because","vi":"bởi vì"},{"en":"despite","vi":"mặc dù"}],"speak":"Although I am busy, I study daily.","write":"Viết đoạn văn 6 câu có although, because và however.","model":"I was tired. However, I studied English because I had an exam."},{"id":"b1-08","level":"B1","title":"Trình bày quan điểm","topic":"Giving opinions","rule":"Dùng I think, In my opinion, I believe; kèm lý do với because và ví dụ với for example.","example":"In my opinion, online learning is useful.","translation":"Theo ý tôi, học trực tuyến hữu ích.","grammar":{"q":"In my ___, practice is essential.","a":"opinion","wrong":["think","believe","idea"],"why":"Cụm cố định In my opinion."},"reading":{"text":"Lena thinks public transport is useful because it reduces traffic.","q":"What does Lena support?","a":"public transport","wrong":["private cars","air travel","online shopping"]},"vocab":[{"en":"opinion","vi":"ý kiến"},{"en":"agree","vi":"đồng ý"},{"en":"disagree","vi":"không đồng ý"},{"en":"reason","vi":"lý do"},{"en":"example","vi":"ví dụ"}],"speak":"I believe learning English opens new opportunities.","write":"Viết đoạn 80 từ nêu quan điểm về học ngoại ngữ.","model":"In my opinion, learning English is important because it helps people communicate and find opportunities."},{"id":"b1-09","level":"B1","title":"Lịch sự khi giao tiếp","topic":"Requests & apologies","rule":"Could you...? là lời nhờ lịch sự; Would you mind + V-ing...?; I’m sorry for + V-ing/noun.","example":"Could you help me, please?","translation":"Bạn có thể giúp tôi được không?","grammar":{"q":"Would you mind ___ the door?","a":"closing","wrong":["close","to close","closed"],"why":"Would you mind + V-ing."},"reading":{"text":"A customer asked Kim to check the order. Kim apologized for the delay.","q":"What did Kim apologize for?","a":"the delay","wrong":["the price","the weather","the address"]},"vocab":[{"en":"apologize","vi":"xin lỗi"},{"en":"request","vi":"yêu cầu"},{"en":"mind","vi":"phiền"},{"en":"delay","vi":"chậm trễ"},{"en":"favor","vi":"việc giúp đỡ"}],"speak":"Could you repeat that, please?","write":"Viết đoạn hội thoại yêu cầu giúp đỡ và xin lỗi.","model":"A: Could you help me? B: Sure. A: Sorry for bothering you. B: No problem."},{"id":"b1-10","level":"B1","title":"Suy đoán có căn cứ","topic":"Must / might / can’t","rule":"Must = gần chắc chắn theo bằng chứng; might/may = có thể; can’t = gần chắc chắn không đúng.","example":"She must be at work.","translation":"Chắc cô ấy đang ở chỗ làm.","grammar":{"q":"He has no ticket, so he ___ be on that flight.","a":"can’t","wrong":["must","might","should"],"why":"Không có vé → không thể lên chuyến bay đó."},"reading":{"text":"All the lights are off and nobody answers. Alex thinks the office might be closed.","q":"What might be closed?","a":"the office","wrong":["the cinema","the school","the airport"]},"vocab":[{"en":"evidence","vi":"bằng chứng"},{"en":"certain","vi":"chắc chắn"},{"en":"possible","vi":"có thể"},{"en":"unlikely","vi":"khó có khả năng"},{"en":"guess","vi":"đoán"}],"speak":"He might be busy right now.","write":"Viết 5 suy đoán từ các tình huống thực tế.","model":"She must be tired because she worked all night. He might be late."},{"id":"b1-11","level":"B1","title":"Thói quen trong quá khứ","topic":"Used to","rule":"Used to + V nói thói quen/tình trạng cũ không còn đúng. Phủ định: didn’t use to.","example":"I used to play football every day.","translation":"Tôi từng đá bóng mỗi ngày.","grammar":{"q":"She used to ___ here.","a":"live","wrong":["lived","living","lives"],"why":"Used to + động từ nguyên mẫu."},"reading":{"text":"Ben used to cycle to school, but now he drives to work.","q":"How did Ben travel to school?","a":"by bicycle","wrong":["by car","by train","on foot"]},"vocab":[{"en":"habit","vi":"thói quen"},{"en":"childhood","vi":"thời thơ ấu"},{"en":"nowadays","vi":"ngày nay"},{"en":"previously","vi":"trước đây"},{"en":"change","vi":"thay đổi"}],"speak":"I used to watch cartoons after school.","write":"Viết 6 câu về cuộc sống trước đây và bây giờ.","model":"I used to wake up late, but now I get up early."},{"id":"b1-12","level":"B1","title":"Hành động kéo dài tới hiện tại","topic":"Present perfect continuous","rule":"Have/has been + V-ing diễn tả hành động bắt đầu trong quá khứ và tiếp diễn tới hiện tại hoặc có kết quả hiện tại.","example":"I have been learning for two hours.","translation":"Tôi đã học suốt hai giờ.","grammar":{"q":"She has been ___ all morning.","a":"working","wrong":["work","worked","works"],"why":"Has been + V-ing."},"reading":{"text":"Owen has been studying since 8 a.m. and is still at his desk.","q":"What has Owen been doing?","a":"studying","wrong":["sleeping","running","cooking"]},"vocab":[{"en":"duration","vi":"khoảng thời gian"},{"en":"ongoing","vi":"đang tiếp diễn"},{"en":"recently","vi":"gần đây"},{"en":"since","vi":"từ khi"},{"en":"for","vi":"trong khoảng"}],"speak":"I have been studying English for a year.","write":"Viết 5 câu về những việc bạn đang duy trì.","model":"I have been practicing English for months. I have been reading every day."},{"id":"b1-13","level":"B1","title":"Kể chuyện sống động","topic":"Narrative tenses","rule":"Kết hợp past simple (sự kiện chính), past continuous (bối cảnh) và past perfect (xảy ra trước một sự kiện quá khứ).","example":"When I arrived, they had left.","translation":"Khi tôi đến, họ đã rời đi.","grammar":{"q":"By the time we arrived, the movie ___ .","a":"had started","wrong":["started","has started","starts"],"why":"Had started chỉ sự việc xảy ra trước lúc chúng tôi đến."},"reading":{"text":"It was raining when Maya arrived. The shop had already closed.","q":"What had happened before Maya arrived?","a":"the shop had closed","wrong":["the rain stopped","the shop opened","the bus came"]},"vocab":[{"en":"event","vi":"sự kiện"},{"en":"background","vi":"bối cảnh"},{"en":"sequence","vi":"trình tự"},{"en":"meanwhile","vi":"trong khi"},{"en":"previously","vi":"trước đó"}],"speak":"I was walking home when I saw an accident.","write":"Viết chuyện ngắn 100 từ với ít nhất 2 thì quá khứ.","model":"I was walking home when it started to rain. I realized I had left my umbrella at school."},{"id":"b2-01","level":"B2","title":"Giả định quá khứ","topic":"Third conditional","rule":"If + past perfect, would have + V3: tưởng tượng kết quả khác của sự việc đã qua.","example":"If I had studied harder, I would have passed.","translation":"Nếu tôi học chăm hơn, tôi đã đỗ.","grammar":{"q":"If we had left earlier, we ___ caught the bus.","a":"would have","wrong":["will have","would","are"],"why":"Third conditional: would have + V3."},"reading":{"text":"Nina missed the train because she left home late.","q":"What did Nina miss?","a":"the train","wrong":["the bus","the plane","the taxi"]},"vocab":[{"en":"regret","vi":"tiếc nuối"},{"en":"consequence","vi":"hệ quả"},{"en":"miss","vi":"bỏ lỡ"},{"en":"otherwise","vi":"nếu không"},{"en":"outcome","vi":"kết quả"}],"speak":"If I had prepared better, I would have felt calmer.","write":"Viết 5 câu về những điều bạn muốn thay đổi trong quá khứ.","model":"If I had practiced more, I would have spoken more confidently."},{"id":"b2-02","level":"B2","title":"Điều kiện hỗn hợp","topic":"Mixed conditionals","rule":"Kết hợp thời điểm: If + past perfect, would + V (kết quả hiện tại của điều kiện quá khứ).","example":"If I had slept well, I would feel better now.","translation":"Nếu tối qua tôi ngủ tốt, giờ tôi đã khỏe hơn.","grammar":{"q":"If I had taken the job, I ___ in London now.","a":"would live","wrong":["will live","would have lived","had lived"],"why":"Điều kiện quá khứ → kết quả hiện tại dùng would live."},"reading":{"text":"Alex did not study medicine, so he is not a doctor today.","q":"What is Alex’s current job status?","a":"not a doctor","wrong":["a doctor","a nurse","a surgeon"]},"vocab":[{"en":"hypothetical","vi":"giả định"},{"en":"present","vi":"hiện tại"},{"en":"past","vi":"quá khứ"},{"en":"cause","vi":"nguyên nhân"},{"en":"result","vi":"kết quả"}],"speak":"If I had learned earlier, I would be fluent now.","write":"Viết 4 câu điều kiện hỗn hợp có kết quả hiện tại.","model":"If I had saved more money, I would own a car now."},{"id":"b2-03","level":"B2","title":"Bị động nâng cao","topic":"Passive reporting structures","rule":"It is believed that... / He is believed to... dùng để trình bày tin tức, báo cáo theo cách khách quan.","example":"It is believed that the painting is valuable.","translation":"Người ta tin rằng bức tranh có giá trị.","grammar":{"q":"The project is expected ___ next year.","a":"to finish","wrong":["finishing","finish","finished"],"why":"Be expected + to-infinitive."},"reading":{"text":"The new hospital is expected to open next spring.","q":"When is the hospital expected to open?","a":"next spring","wrong":["next winter","this summer","today"]},"vocab":[{"en":"reportedly","vi":"theo tin đưa"},{"en":"expected","vi":"dự kiến"},{"en":"believed","vi":"được tin rằng"},{"en":"estimated","vi":"ước tính"},{"en":"announced","vi":"được thông báo"}],"speak":"The project is expected to improve transport.","write":"Viết đoạn tin tức 80 từ dùng 2 cấu trúc bị động.","model":"The new bridge is expected to open next month. It is believed to reduce traffic."},{"id":"b2-04","level":"B2","title":"Tường thuật nâng cao","topic":"Reporting verbs","rule":"Advise + object + to V; suggest + V-ing hoặc suggest (that)...; deny + V-ing; admit + V-ing.","example":"She suggested taking a break.","translation":"Cô ấy đề nghị nghỉ giải lao.","grammar":{"q":"He denied ___ the document.","a":"sharing","wrong":["to share","share","shared"],"why":"Deny + V-ing."},"reading":{"text":"The manager advised everyone to arrive early for the meeting.","q":"What did the manager advise?","a":"arrive early","wrong":["leave early","work from home","cancel the meeting"]},"vocab":[{"en":"admit","vi":"thừa nhận"},{"en":"deny","vi":"phủ nhận"},{"en":"urge","vi":"thúc giục"},{"en":"recommend","vi":"đề xuất"},{"en":"insist","vi":"khăng khăng"}],"speak":"She advised me to review the report.","write":"Viết 5 câu tường thuật với các reporting verbs khác nhau.","model":"The teacher recommended revising daily. She advised us to practice speaking."},{"id":"b2-05","level":"B2","title":"Đảo ngữ nhấn mạnh","topic":"Negative inversion","rule":"Khi trạng ngữ phủ định đứng đầu, đảo trợ động từ lên trước chủ ngữ: Never have I...; Rarely do we...","example":"Never have I seen such a view.","translation":"Tôi chưa từng thấy cảnh nào như vậy.","grammar":{"q":"Rarely ___ we see such results.","a":"do","wrong":["are","have","did"],"why":"Rarely + do + chủ ngữ + V (hiện tại đơn)."},"reading":{"text":"Rarely does this museum close early; today is an exception.","q":"What is unusual today?","a":"the museum closes early","wrong":["the museum opens late","the museum is free","the museum is crowded"]},"vocab":[{"en":"rarely","vi":"hiếm khi"},{"en":"hardly","vi":"hầu như không"},{"en":"never","vi":"không bao giờ"},{"en":"scarcely","vi":"vừa mới"},{"en":"under no circumstances","vi":"trong bất cứ trường hợp nào cũng không"}],"speak":"Never have I felt more motivated.","write":"Viết 4 câu đảo ngữ với never/rarely/hardly.","model":"Rarely do I miss a lesson. Never have I seen such an inspiring film."},{"id":"b2-06","level":"B2","title":"Câu chẻ nhấn mạnh","topic":"Cleft sentences","rule":"It is/was + phần nhấn mạnh + that/who...; What + clause + be + phần nhấn mạnh.","example":"What I need is more practice.","translation":"Điều tôi cần là luyện tập thêm.","grammar":{"q":"It was John ___ solved the problem.","a":"who","wrong":["where","when","whose"],"why":"Nhấn mạnh người với who."},"reading":{"text":"It was Clara who designed the award-winning logo.","q":"Who designed the logo?","a":"Clara","wrong":["John","Anna","Michael"]},"vocab":[{"en":"emphasis","vi":"nhấn mạnh"},{"en":"highlight","vi":"làm nổi bật"},{"en":"focus","vi":"trọng tâm"},{"en":"purpose","vi":"mục đích"},{"en":"priority","vi":"ưu tiên"}],"speak":"What matters most is consistency.","write":"Viết 4 câu nhấn mạnh ý quan trọng.","model":"What I value most is honesty. It was my teacher who inspired me."},{"id":"b2-07","level":"B2","title":"Rút gọn mệnh đề","topic":"Participle clauses","rule":"V-ing cho hành động chủ động hoặc đồng thời; V3 cho ý bị động. Chủ thể phải rõ để tránh lỗi dangling participle.","example":"Walking home, I met an old friend.","translation":"Khi đi bộ về nhà, tôi gặp bạn cũ.","grammar":{"q":"___ by the rain, the match was delayed.","a":"Affected","wrong":["Affect","Affecting","To affect"],"why":"Bị ảnh hưởng bởi mưa → V3 Affected."},"reading":{"text":"Feeling exhausted after work, Daniel went straight to bed.","q":"Why did Daniel go to bed?","a":"he was exhausted","wrong":["he was hungry","he had guests","he was early"]},"vocab":[{"en":"participial","vi":"thuộc phân từ"},{"en":"reduced","vi":"rút gọn"},{"en":"simultaneous","vi":"đồng thời"},{"en":"affected","vi":"bị ảnh hưởng"},{"en":"exhausted","vi":"kiệt sức"}],"speak":"Feeling confident, I started my presentation.","write":"Viết 4 câu dùng participle clauses.","model":"Having finished my homework, I went out. Inspired by the talk, I made a plan."},{"id":"b2-08","level":"B2","title":"Diễn đạt thận trọng","topic":"Hedging & cautious language","rule":"Dùng may, might, appear to, tend to, likely để tránh khẳng định quá chắc khi chưa đủ bằng chứng.","example":"This may suggest a change in habits.","translation":"Điều này có thể gợi ý sự thay đổi thói quen.","grammar":{"q":"The findings ___ indicate a trend.","a":"may","wrong":["must always","never","certainly"],"why":"May diễn đạt kết luận thận trọng."},"reading":{"text":"The report suggests that remote work may improve job satisfaction.","q":"What might remote work improve?","a":"job satisfaction","wrong":["fuel prices","office rent","traffic lights"]},"vocab":[{"en":"apparently","vi":"có vẻ như"},{"en":"likely","vi":"có khả năng"},{"en":"perhaps","vi":"có lẽ"},{"en":"indicate","vi":"chỉ ra"},{"en":"suggest","vi":"gợi ý"}],"speak":"The results may indicate a positive change.","write":"Viết đoạn phân tích 80 từ với ít nhất 3 hedging expressions.","model":"The data may suggest improvement. However, more research is likely to be needed."},{"id":"b2-09","level":"B2","title":"Liên kết lập luận","topic":"Advanced discourse markers","rule":"Moreover thêm ý; nevertheless nhượng bộ; consequently chỉ hệ quả; whereas đối chiếu. Chú ý dấu câu.","example":"The plan is costly; nevertheless, it is effective.","translation":"Kế hoạch tốn kém; tuy nhiên, nó hiệu quả.","grammar":{"q":"The costs rose. ___, the company reduced spending.","a":"Consequently","wrong":["Moreover","Whereas","Nevertheless"],"why":"Cắt giảm là hệ quả của chi phí tăng → Consequently."},"reading":{"text":"Sales increased. Nevertheless, profits fell due to rising costs.","q":"What happened to profits?","a":"they fell","wrong":["they rose","they stayed the same","they doubled"]},"vocab":[{"en":"moreover","vi":"hơn nữa"},{"en":"nevertheless","vi":"tuy nhiên"},{"en":"consequently","vi":"do đó"},{"en":"whereas","vi":"trong khi"},{"en":"furthermore","vi":"hơn nữa"}],"speak":"The idea is ambitious; nevertheless, it is achievable.","write":"Viết đoạn 100 từ dùng 4 từ nối nâng cao.","model":"The solution is affordable. Moreover, it is practical. Nevertheless, some risks remain."},{"id":"b2-10","level":"B2","title":"Suy đoán về quá khứ","topic":"Past modal deduction","rule":"Must have + V3: suy đoán gần chắc chắn; might have + V3: có thể; can’t have + V3: chắc chắn không.","example":"She must have forgotten the meeting.","translation":"Chắc cô ấy đã quên cuộc họp.","grammar":{"q":"He ___ have seen the email function courseCard(l){const k=COURSES.indexOf(l)+1,isDone=!!state.completed[l.id];return `<article class="course-card"><div class="course-card-top"><span class="level-tag ${l.level.toLowerCase()}">${l.level}</span><span class="course-no">BÀI ${String(k).padStart(2,'0')}${isDone?' • ✓ ĐÃ HỌC':''}</span></div><h3>${E(l.title)}</h3><p>${E(l.topic)}<br>${E(l.rule.slice(0,90))}${l.rule.length>90?'…':''}</p><div class="course-card-bottom"><span>⏱ 25–40 phút · 5 từ</span><button class="btn ${isDone?'btn-secondary':'btn-primary'} btn-sm" data-action="open-lesson" data-id="${l.id}">${isDone?'Ôn lại ↗':'Học ngay →'}</button></div></article>`}
function courseGrid(){const q=view.search.trim().toLocaleLowerCase('vi');const ls=COURSES.filter(l=>(view.filter==='all'||l.level===view.filter)&&(!q||`${l.title} ${l.topic} ${l.rule} ${l.level}`.toLocaleLowerCase('vi').includes(q)));if(!ls.length)return '<div class="empty" style="grid-column:1/-1">Không có bài học phù hợp. Hãy thử từ khóa khác.</div>';return ls.map(courseCard).join('')}
function roadmap(){const cur=levelOf(view.filter);return `<div class="roadmap-intro"><div><span class="eyebrow">HỌC THEO TRÌNH TỰ</span><h1>Lộ trình chinh phục tiếng Anh</h1><p class="muted">${COURSES.length} bài chuyên đề · 5 cấp độ · Học từ A0 trước khi tiến tới B1 và B2.</p></div><input id="lesson-search" class="search-box" type="search" placeholder="⌕  Tìm bài học, ngữ pháp..." aria-label="Tìm bài học" value="${E(view.search)}"></div><div class="filters">${[['all','Tất cả'],...LEVELS.map(l=>[l.id,`${l.id} · ${l.name}`])].map(([id,name])=>`<button class="filter-btn ${view.filter===id?'active':''}" data-action="filter" data-level="${id}">${name}</button>`).join('')}</div>${cur?`<div class="level-syllabus"><div class="level-dot" style="width:56px;height:56px;font-size:25px">${cur.icon}</div><div><span class="eyebrow">CHẶNG ${cur.id}</span><h3>${cur.name}</h3><p>${cur.desc} · ${doneCount(cur.id)}/${COURSES.filter(x=>x.level===cur.id).length} bài đã hoàn thành.</p></div></div>`:''}<div class="course-grid" id="course-grid">${courseGrid()}</div><div class="stat-caption" style="margin-top:20px">Lịch gợi ý: 5 buổi học + 1 buổi ôn + 1 ngày nghỉ mỗi tuần. Mỗi cấp có các bài trọng tâm, nhưng muốn đạt trình độ tương ứng cần luyện thực tế thêm ngoài website.</div>`}
function lessonPage(){const l=lessonOf(view.lessonId),i=COURSES.indexOf(l),Q=qset(l),score=Q.filter((q,j)=>view.answers[j]===q.right).length;const passed=score>=4;const isDone=!!state.completed[l.id];return `<div class="lesson-heading"><button class="back-btn" data-action="nav" data-page="roadmap" title="Quay lại danh sách">←</button><div style="flex:1"><span class="level-tag ${l.level.toLowerCase()}">${l.level} · ${levelOf(l.level).name}</span><span class="small muted" style="margin-left:10px">BÀI ${i+1} / ${COURSES.length} · 25–40 PHÚT</span><h1>${E(l.title)}</h1><p>Chủ điểm: <b>${E(l.topic)}</b> • Luyện đủ 5 phần để ghi nhớ hiệu quả.</p></div>${isDone?'<span class="level-tag a1">✓ Đã hoàn thành</span>':''}</div>
<div class="lesson-layout"><div class="lesson-main">
<section class="lesson-section" id="theory"><h2><span class="section-number">01</span> Ngữ pháp dễ hiểu</h2><div class="eyebrow" style="margin-bottom:10px">${E(l.topic)}</div><div class="rule-box">${E(l.rule)}</div><div class="example-quote"><div class="small muted" style="margin-bottom:8px">VÍ DỤ THỰC TẾ</div><strong>${E(l.example)}</strong><p>${E(l.translation)}</p><button class="btn btn-secondary btn-sm" style="margin-top:13px" data-action="speak" data-text="${E(l.example)}">🔊 Nghe phát âm</button></div></section>

<section class="lesson-section" id="listening"><h2><span class="section-number">03</span> Nghe và đọc hiểu</h2><p class="muted small">Nhấn nghe, thử hiểu nội dung mà không nhìn chữ, sau đó bật lại để đối chiếu.</p><div class="hero-actions" style="margin:12px 0 16px"><button class="btn btn-primary btn-sm" data-action="speak" data-text="${E(l.reading.text)}">🔊 Nghe đoạn hội thoại / câu chuyện</button><button class="btn btn-secondary btn-sm" data-action="toggle-passage">${view.hidePassage?'👁 Hiện nội dung':'🙈 Ẩn nội dung để luyện nghe'}</button></div><div class="read-box">${view.hidePassage?'<span class="muted">Nội dung đang được ẩn. Hãy nghe và đoán ý chính.</span>':E(l.reading.text)}</div><p class="small muted" style="margin:12px 0 0">Phần nghe sử dụng giọng đọc tổng hợp có sẵn trong trình duyệt. Nếu không có âm thanh, kiểm tra cài đặt âm lượng và trình duyệt.</p></section>

<section class="lesson-section" id="quiz"><h2><span class="section-number">05</span> Bài kiểm tra 5 câu</h2><p class="muted small">1 câu ngữ pháp, 1 câu đọc hiểu, 3 câu từ vựng. Đạt ít nhất 4/5 (80%) để hoàn thành bài.</p>${Q.map((q,j)=>`<div class="question-block"><div class="question-title">${j+1}. ${E(q.q)}</div><div class="options">${q.opts.map((option,k)=>{const selected=view.answers[j]===option;const cls=view.submitted?(option===q.right?'correct':selected?'incorrect':''):(selected?'selected':'');return `<button class="option ${cls}" data-action="answer" data-index="${j}" data-option="${E(option)}" ${view.submitted?'disabled':''}><span class="option-letter">${'ABCD'[k]}</span><span>${E(option)}</span></button>`}).join('')}</div>${view.submitted?`<div class="answer-explain">${view.answers[j]===q.right?'✓ Chính xác!':'✗ Đáp án đúng: '+E(q.right)} ${E(q.desc)}</div>`:''}</div>`).join('')}${view.submitted?`<div class="quiz-result"><div><div class="confetti">${passed?'🎉':'💪'}</div><strong>${score}/5 câu đúng • ${pct(score,5)}%</strong><div class="small muted">${passed?'Đạt yêu cầu. Tiến độ đã được lưu.':'Chưa đạt 80%. Xem giải thích và làm lại nhé!'}</div></div><button class="btn btn-secondary btn-sm" data-action="retry">Làm lại ↻</button></div>`:`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:19px;flex-wrap:wrap"><span class="small muted">Đã trả lời ${Object.keys(view.answers).length}/5 câu</span><button class="btn btn-primary" data-action="grade" ${Object.keys(view.answers).length!==5?'disabled':''}>Chấm bài & lưu điểm ✓</button></div>`}</section>
<section class="lesson-section" id="writing"><h2><span class="section-number">06</span> Tự luyện viết</h2><p><b>${E(l.write)}</b></p><textarea id="writing-input" class="input-box" placeholder="Viết câu trả lời bằng tiếng Anh tại đây...">${E(state.notes[l.id]||'')}</textarea><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:10px"><span class="small muted" id="word-count">${(state.notes[l.id]||'').trim().split(/\s+/).filter(Boolean).length} từ · Tự lưu</span><button class="btn btn-secondary btn-sm" data-action="model">${view.showModel?'Ẩn bài mẫu':'👁 Xem bài mẫu để đối chiếu'}</button></div>${view.showModel?`<div class="model-answer"><div class="small muted" style="margin-bottom:8px">VÍ DỤ THAM KHẢO (KHÔNG PHẢI ĐÁP ÁN DUY NHẤT)</div>${E(l.model)}</div>`:''}<div class="checklist"><label><input type="checkbox"> Tôi đã dùng cấu trúc vừa học</label><label><input type="checkbox"> Tôi đã kiểm tra chính tả và dấu câu</label><label><input type="checkbox"> Tôi đã đọc bài viết thành tiếng</label></div><div class="small muted">Phần viết tự luyện và tự đối chiếu, không có AI chấm tự động.</div></section>

<aside class="lesson-aside"><section class="panel panel-tight"><h3>🧭 Hành trình bài học</h3><div class="step-list">${[['01','Học lý thuyết','#theory'],['02','Ghi nhớ từ vựng','#words'],['03','Luyện nghe','#listening'],['04','Thực hành nói','#speaking'],['05','Làm trắc nghiệm','#quiz'],['06','Tập viết','#writing']].map(x=>`<a href="${x[2]}" style="text-decoration:none;color:var(--text)" class="step-row"><span class="step-ico">${x[0]}</span><span class="small strong">${x[1]}</span></a>`).join('')}</div></section><section class="tip"><strong>💡 Mẹo học hiệu quả</strong><br>Nghe mẫu 2 lần, nói lại 3 lần, làm bài kiểm tra và ôn Flashcards ngày hôm sau. Bài khó có thể học nhiều buổi.</section><section class="panel panel-tight"><h3>📊 Kết quả của bạn</h3><div class="level-mini"><span class="small muted">Trạng thái</span><strong style="color:var(--green)">${isDone?'Đã hoàn thành':'Đang học'}</strong></div><div class="level-mini"><span class="small muted">Điểm tốt nhất</span><strong>${state.scores[l.id]??'—'}${state.scores[l.id]!==undefined?'%':''}</strong></div>${progBar(state.scores[l.id]??0)}</section></aside></div>`}
function deck(){const today=dateLocal();let w=allWords().filter(w=>view.flashLevel==='all'||w.level===view.flashLevel);const due=w.filter(w=>!state.cards[w.key]||state.cards[w.key].due<=today);return due}
function vocabPage(){const d=deck();view.flashIndex=Math.min(view.flashIndex,Math.max(0,d.length-1));const w=d[view.flashIndex];return `<span class="eyebrow">🧠 SPACED REPETITION</span><h1 style="margin:10px 0">Ôn từ vựng bằng Flashcards</h1><p class="muted">${allWords().length} thẻ từ vựng theo cấp độ. Bấm vào thẻ để lật, tự đánh giá nhớ/chưa nhớ; các từ sẽ quay lại ôn theo lịch 1, 3, 7, 14, 30 ngày.</p><div class="filters">${[['all','Tất cả'],...LEVELS.map(l=>[l.id,l.id])].map(([id,name])=>`<button class="filter-btn ${view.flashLevel===id?'active':''}" data-action="flash-filter" data-level="${id}">${name}</button>`).join('')}</div><div class="two-col"><section class="panel"><div class="panel-heading"><h3>Thẻ đến hạn / cần ôn</h3><span class="muted small">${d.length} thẻ trong lượt này</span></div>${w?`<div class="flash-container"><div class="flash-card" role="button" tabindex="0" data-action="flip" aria-label="Lật thẻ từ vựng"><div class="small" style="color:#c8c0ff">${w.level} · ${E(w.lesson)}</div><h2>${view.flashFlipped?E(w.vi):E(w.en)}</h2><p>${view.flashFlipped?E(w.en):'Nhấn vào thẻ để xem nghĩa tiếng Việt'}</p></div><div class="flash-controls"><button class="btn btn-secondary" data-action="flash-again">↻ Chưa nhớ</button><button class="btn btn-secondary" data-action="speak" data-text="${E(w.en)}">🔊 Nghe</button><button class="btn btn-primary" data-action="flash-know">✓ Đã nhớ</button></div><div class="flash-progress">Thẻ ${view.flashIndex+1} / ${d.length} · ${E(w.lesson)}</div></div>`:'<div class="empty">Chưa có thẻ trong bộ này.</div>'}</section><section class="panel"><h3>📌 Cách hệ thống ôn từ</h3><p class="small muted">Thẻ nào bạn đánh dấu “Đã nhớ” sẽ được hẹn ôn lại sau 1 ngày, 3 ngày, 7 ngày, 14 ngày rồi 30 ngày. Chọn “Chưa nhớ” sẽ đưa thẻ về lượt ôn gần nhất.</p><div class="level-row"><strong>Thẻ đã học</strong><b style="margin-left:auto">${countKnown()}</b></div><div class="level-row"><strong>Tổng thẻ từ</strong><b style="margin-left:auto">${allWords().length}</b></div><div class="level-row"><strong>Bài học đã hoàn thành</strong><b style="margin-left:auto">${completed()}</b></div><div class="tip" style="margin-top:19px"><strong>Gợi ý:</strong> Mỗi ngày nên ôn 10–15 từ trước khi học bài mới. Bấm 🔊 để nghe phát âm từ.</div></section></div>`}
function startPractice(){const pool=COURSES.filter(l=>view.practiceLevel==='all'||l.level===view.practiceLevel).flatMap(l=>qset(l).map((q,i)=>({...q,lesson:l.title,id:`${l.id}-${i}`})));const ids=new Set();view.practiceQuestions=shuffleFixed(pool,Date.now()%997).filter(q=>{if(ids.has(q.id))return false;ids.add(q.id);return true}).slice(0,10);view.practiceAnswers={};view.practiceDone=false;render()}
function practicePage(){const qs=view.practiceQuestions;const score=qs.filter((q,i)=>view.practiceAnswers[i]===q.right).length;return `<span class="eyebrow">🧩 ÔN TẬP TỔNG HỢP</span><h1 style="margin:10px 0">Phòng luyện tập</h1><p class="muted">Bài kiểm tra nhanh 10 câu được chọn từ ngân hàng câu hỏi của 62 bài học. Đề mới sẽ được tạo mỗi lần bắt đầu.</p><div class="panel" style="max-width:930px;margin:20px auto"><div class="panel-heading"><h3>⚡ Quick Quiz • 10 câu</h3><span class="level-tag">MIỄN PHÍ</span></div><div class="settings-row"><span class="muted">Chọn trình độ muốn ôn tập</span><select class="select" id="practice-level"><option value="all" ${view.practiceLevel==='all'?'selected':''}>Tất cả cấp độ</option>${LEVELS.map(l=>`<option value="${l.id}" ${view.practiceLevel===l.id?'selected':''}>${l.id} · ${l.name}</option>`).join('')}</select></div>${!qs.length?`<div class="center" style="padding:25px"><div style="font-size:50px">🧠</div><h3>Sẵn sàng kiểm tra?</h3><p class="muted">Gồm ngữ pháp, từ vựng và đọc hiểu. Kết quả xuất hiện ngay sau khi nộp.</p><button class="btn btn-primary" data-action="start-practice">Bắt đầu 10 câu →</button></div>`:`<div class="practice-questions">${qs.map((q,i)=>`<div class="question-block"><div class="question-title">${i+1}. ${E(q.q)}</div><div class="options">${q.opts.map((option,k)=>{const s=view.practiceAnswers[i]===option,cls=view.practiceDone?(option===q.right?'correct':s?'incorrect':''):(s?'selected':'');return `<button class="option ${cls}" data-action="practice-answer" data-index="${i}" data-option="${E(option)}" ${view.practiceDone?'disabled':''}><span class="option-letter">${'ABCD'[k]}</span>${E(option)}</button>`}).join('')}</div>${view.practiceDone?`<div class="answer-explain">${sAnswer(q,view.practiceAnswers[i])} ${E(q.desc)}</div>`:''}</div>`).join('')}${view.practiceDone?`<div class="quiz-result"><div><strong>🎯 ${score} / ${qs.length} câu đúng</strong><p class="small muted" style="margin:5px 0">Bạn có thể luyện lại với bộ câu hỏi khác.</p></div><button class="btn btn-primary" data-action="start-practice">Đề khác ↻</button></div>`:`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px"><span class="small muted">${Object.keys(view.practiceAnswers).length}/${qs.length} câu</span><button class="btn btn-primary" data-action="submit-practice" ${Object.keys(view.practiceAnswers).length!==qs.length?'disabled':''}>Nộp bài và xem điểm</button></div>`}</div>`}</div>`}
function sAnswer(q,choice){return choice===q.right?'✓ Chính xác!':'✗ Đúng: '+E(q.right)+'.'}
function reportPage(){const days=[];for(let i=6;i>=0;i--)days.push(addDays(dateLocal(),-i));const max=3;return `<span class="eyebrow">📈 LEARNING ANALYTICS</span><h1 style="margin:11px 0">Thành quả học tập</h1><p class="muted">Bảng theo dõi được tính từ những bài bạn đã làm trên thiết bị này.</p><div class="metrics">${statsCard('✅','Bài đã học',completed(),`/ ${COURSES.length} bài`)}${statsCard('🎯','Điểm trung bình',`${avgScore()}%`,'điểm cao nhất từng bài')}${statsCard('🧠','Từ ghi nhớ',countKnown(),`/ ${allWords().length} thẻ`)}${statsCard('⏳','Thời gian ước tính',`${completed()*30} phút`,'30 phút / bài đã đạt')}</div><div class="report-grid" style="margin-top:20px"><section class="panel"><h3>Tiến độ theo cấp độ</h3>${LEVELS.map(l=>{const c=doneCount(l.id),t=COURSES.filter(x=>x.level===l.id).length;return `<div style="margin-top:17px"><div class="level-mini"><b>${l.icon} ${l.id} · ${l.name}</b><span class="muted small">${c}/${t} (${pct(c,t)}%)</span></div>${progBar(pct(c,t))}</div>`}).join('')}</section><section class="panel"><h3>Hoạt động 7 ngày gần đây</h3><div class="bars">${days.map(d=>{const n=state.days.includes(d)?1:0,day=new Date(d+'T12:00:00').getDay();return `<div class="bar-wrap"><div class="bar" title="${d}: ${n?'Có hoạt động':'Chưa có'}" style="height:${n?'80%':'5px'};opacity:${n?1:.25}"></div><span class="bar-label">${['CN','T2','T3','T4','T5','T6','T7'][day]}</span></div>`}).join('')}</div><p class="muted small" style="margin-top:38px">Biểu đồ ghi nhận những ngày hoàn thành ít nhất một bài kiểm tra đạt 80%, không theo dõi chính xác thời gian ngồi học.</p><div class="tip"><strong>🔥 Chuỗi hiện tại: ${streak()} ngày.</strong><br>Hãy cố gắng duy trì đều đặn hơn là học dồn.</div></section></div><section class="panel" style="margin-top:18px"><h3>Điểm các bài gần đây</h3>${Object.entries(state.scores).length?`<table class="table-simple"><thead><tr><th>Bài học</th><th>Cấp độ</th><th>Điểm cao nhất</th></tr></thead><tbody>${Object.entries(state.scores).slice(-12).reverse().map(([id,score])=>{const l=lessonOf(id);return `<tr><td>${E(l.title)}</td><td>${l.level}</td><td><b>${score}%</b></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Chưa có điểm bài kiểm tra. Hãy học và chấm bài đầu tiên.</div>'}</section>`}
function settingsPage(){return `<span class="eyebrow">⚙ TÙY CHỈNH</span><h1 style="margin:10px 0">Cài đặt học tập</h1><p class="muted">Thiết lập mục tiêu, giao diện và quản lý dữ liệu lưu trong trình duyệt.</p><div class="two-col"><section class="panel"><h3>🎯 Mục tiêu cá nhân</h3><div class="settings-row"><div><b>Thời gian mong muốn mỗi ngày</b><div class="small muted">Đây là mục tiêu tham khảo, không phải bộ đếm thời gian.</div></div><select class="select" id="daily-goal"><option value="30" ${state.dailyGoal===30?'selected':''}>30 phút</option><option value="45" ${state.dailyGoal===45?'selected':''}>45 phút</option><option value="60" ${state.dailyGoal===60?'selected':''}>60 phút</option></select></div><div class="settings-row"><div><b>Giao diện</b><div class="small muted">Chọn chế độ sáng hoặc tối.</div></div><button class="btn btn-secondary btn-sm" data-action="theme">${state.theme==='dark'?'☀ Chuyển chế độ sáng':'☾ Chuyển chế độ tối'}</button></div><div class="tip" style="margin-top:17px"><strong>Lộ trình tham khảo</strong><br>Học 30–60 phút/ngày theo thứ tự A0 → A1 → A2 → B1 → B2. Đạt B2 thường đòi hỏi hàng trăm giờ tiếp xúc với tiếng Anh và thực hành giao tiếp ngoài các bài trên web.</div></section><section class="panel"><h3>💾 Sao lưu và khôi phục</h3><p class="small muted">Dữ liệu được giữ bằng localStorage. Xóa dữ liệu trình duyệt hoặc dùng máy khác có thể mất tiến độ nếu không sao lưu.</p><div class="settings-row"><div><b>Xuất tiến độ</b><div class="small muted">Lưu file .json về máy.</div></div><button class="btn btn-secondary btn-sm" data-action="export">⬇ Xuất JSON</button></div><div class="settings-row"><div><b>Nhập tiến độ</b><div class="small muted">Đọc bản sao lưu English Academy.</div></div><label class="btn btn-secondary btn-sm" for="import-file" style="cursor:pointer">⬆ Nhập JSON</label><input class="sr-only" type="file" id="import-file" accept=".json,application/json"></div><div class="settings-row"><div><b>Xóa toàn bộ dữ liệu học</b><div class="small muted">Chỉ xóa dữ liệu English Academy trên trình duyệt này.</div></div><button class="btn btn-secondary btn-sm" style="color:var(--red)" data-action="reset">Xóa dữ liệu</button></div></section></div><section class="panel" style="margin-top:18px"><h3>🌐 Tài nguyên luyện thêm (miễn phí)</h3><div class="resource-grid"><a class="resource-link" href="https://learnenglish.britishcouncil.org/" target="_blank" rel="noopener noreferrer"><b>British Council LearnEnglish ↗</b><span>Luyện theo kỹ năng và trình độ.</span></a><a class="resource-link" href="https://www.bbc.co.uk/learningenglish" target="_blank" rel="noopener noreferrer"><b>BBC Learning English ↗</b><span>Nghe tiếng Anh, học cách dùng từ.</span></a><a class="resource-link" href="https://www.cambridgeenglish.org/learning-english/" target="_blank" rel="noopener noreferrer"><b>Cambridge English ↗</b><span>Bài tập, hoạt động và kiến thức CEFR.</span></a><a class="resource-link" href="https://dictionary.cambridge.org/" target="_blank" rel="noopener noreferrer"><b>Cambridge Dictionary ↗</b><span>Tra phát âm và ngữ nghĩa.</span></a></div><p class="small muted" style="margin:15px 0 0">Các liên kết này cần kết nối Internet; website chính không yêu cầu kết nối để làm bài khi đã tải nội dung.</p></section>`}
function render(){const content=({home,roadmap,lesson:lessonPage,vocab:vocabPage,practice:practicePage,report:reportPage,settings:settingsPage}[view.page]||home)();shell(content)}
function speak(s){if(!('speechSynthesis' in window)){toast('Trình duyệt chưa hỗ trợ giọng đọc.');return}window.speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(s);utter.lang='en-US';utter.rate=.85;utter.pitch=1;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>/^en[-_]/i.test(v.lang)&&/female|zira|samantha|google us|aria/i.test(v.name))||voices.find(v=>/^en[-_]/i.test(v.lang));if(voice)utter.voice=voice;speechSynthesis.speak(utter)}
function record(){const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;const feedback=document.getElementById('speak-feedback');if(!SpeechRecognition){if(feedback)feedback.textContent='Micro/nhận dạng giọng nói chưa được trình duyệt này hỗ trợ. Hãy nghe mẫu rồi tự đọc lại.';return}try{const r=new SpeechRecognition();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;if(feedback)feedback.textContent='🎙 Đang nghe… Vui lòng cho phép truy cập micro.';r.onresult=evt=>{const heard=evt.results[0][0].transcript,target=lessonOf(view.lessonId).speak;const clean=s=>s.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(Boolean);const a=clean(heard),b=clean(target);const overlap=b.filter(w=>a.includes(w)).length;const rate=pct(overlap,b.length);view.spoken=`Bạn nói: “${heard}”. Mức khớp từ khoảng ${rate}% (chỉ so từ, không đánh giá phát âm).`;if(document.getElementById('speak-feedback'))document.getElementById('speak-feedback').textContent=view.spoken};r.onerror=e=>{if(feedback)feedback.textContent=`Không nhận dạng được (${e.error}). Bạn có thể tự đọc theo giọng mẫu.`};r.onnomatch=()=>{if(feedback)feedback.textContent='Chưa nhận ra câu nói. Hãy thử nói rõ hơn.'};r.start()}catch{if(feedback)feedback.textContent='Không khởi động được micro trên trình duyệt này.'}}
function download(){const data=JSON.stringify({app:'english-academy',version:1,exportedAt:new Date().toISOString(),data:state},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`english-academy-backup-${dateLocal()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
async function importJSON(file){if(!file)return;try{if(file.size>2e6)throw new Error('File quá lớn');const raw=JSON.parse(await file.text());if(raw.app!=='english-academy'||raw.version!==1||!raw.data||typeof raw.data!=='object')throw new Error('Sai định dạng sao lưu');const b=fresh();for(const k of Object.keys(b))if(raw.data[k]!==undefined && typeof raw.data[k]===typeof b[k])b[k]=raw.data[k];state=b;save();render();toast('Đã nhập bản sao lưu thành công.')}catch(e){toast(`Không thể nhập: ${e.message}`)}}
root.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 if(a==='nav')nav(el.dataset.page);else if(a==='open-lesson')nav('lesson',el.dataset.id);
 else if(a==='menu'){view.sideOpen=!view.sideOpen;render()}else if(a==='close-menu'){view.sideOpen=false;render()}
 else if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();render()}
 else if(a==='level'){view.filter=el.dataset.level;view.search='';nav('roadmap')}
 else if(a==='filter'){view.filter=el.dataset.level;render()}
 else if(a==='speak')speak(el.dataset.text);
 else if(a==='toggle-passage'){view.hidePassage=!view.hidePassage;render()}
 else if(a==='record')record();
 else if(a==='answer'){if(view.submitted)return;view.answers[Number(el.dataset.index)]=el.dataset.option;render()}
 else if(a==='grade'){const l=lessonOf(view.lessonId),qs=qset(l);if(Object.keys(view.answers).length!==qs.length)return;const score=qs.filter((q,i)=>view.answers[i]===q.right).length*20;state.scores[l.id]=Math.max(score,state.scores[l.id]||0);if(score>=80){state.completed[l.id]=true;activity()}save();view.submitted=true;render();toast(score>=80?'🎉 Bạn đã hoàn thành bài học!':'Hãy xem lại phần giải thích và thử lại nhé.')}
 else if(a==='retry'){view.answers={};view.submitted=false;render()}
 else if(a==='model'){view.showModel=!view.showModel;render()}
 else if(a==='flash-filter'){view.flashLevel=el.dataset.level;view.flashIndex=0;view.flashFlipped=false;render()}
 else if(a==='flip'){view.flashFlipped=!view.flashFlipped;render()}
 else if(a==='flash-know'||a==='flash-again'){const w=deck()[view.flashIndex];if(!w)return;const old=state.cards[w.key]||{interval:0};const interval=a==='flash-again'?0:Math.min((old.interval||0)+1,5);const due=addDays(dateLocal(),[0,1,3,7,14,30][interval]);state.cards[w.key]={interval,due};save();const remaining=deck();view.flashIndex=remaining.length?view.flashIndex%remaining.length:0;view.flashFlipped=false;render();toast(a==='flash-know'?'✓ Đã lên lịch ôn lại':'↻ Đã đánh dấu cần ôn lại')}
 else if(a==='start-practice')startPractice();else if(a==='practice-answer'){if(view.practiceDone)return;view.practiceAnswers[Number(el.dataset.index)]=el.dataset.option;render()}
 else if(a==='submit-practice'){if(Object.keys(view.practiceAnswers).length===view.practiceQuestions.length){view.practiceDone=true;render()}}
 else if(a==='export')download();else if(a==='reset'){if(confirm('Bạn chắc chắn muốn xóa toàn bộ tiến độ, từ vựng và bài viết trên thiết bị này?')){state=fresh();save();view.answers={};view.submitted=false;nav('home');toast('Đã xóa tiến độ trên thiết bị này.')}}
});
root.addEventListener('input',e=>{if(e.target.id==='lesson-search'){view.search=e.target.value;document.getElementById('course-grid').innerHTML=courseGrid()}if(e.target.id==='writing-input'){state.notes[view.lessonId]=e.target.value;save();const c=document.getElementById('word-count');if(c)c.textContent=`${e.target.value.trim().split(/\s+/).filter(Boolean).length} từ · Đã tự lưu`}});
root.addEventListener('change',e=>{if(e.target.id==='daily-goal'){state.dailyGoal=Number(e.target.value);save();toast('Đã lưu mục tiêu hằng ngày.')}if(e.target.id==='practice-level'){view.practiceLevel=e.target.value;view.practiceQuestions=[];view.practiceAnswers={};view.practiceDone=false;render()}if(e.target.id==='import-file')importJSON(e.target.files?.[0])});
root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('flash-card')){e.preventDefault();view.flashFlipped=!view.flashFlipped;render()}});
render();
})();

</script>
</body>
</html>
